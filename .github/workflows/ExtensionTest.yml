name: ExtensionTest
on:
  push:
    branches: [main]
    tags: [v*]
  pull_request:
jobs:
  test:
    name: ${{ matrix.extension }} - Julia ${{ matrix.julia-version }} 
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        julia-version: [min, lts, 1, pre]
        extension:
          - ArviZMCMCChainsExt
          - ArviZSampleChainsExt
          - ArviZSampleChainsDynamicHMCExt
        # SampleChains requires StatsBase v0.33, which restricts DimensionalData to
        # versions that fail to precompile on Julia v1.12+
        exclude:
          - extension: ArviZSampleChainsExt
            julia-version: 1
          - extension: ArviZSampleChainsExt
            julia-version: pre
          - extension: ArviZSampleChainsDynamicHMCExt
            julia-version: 1
          - extension: ArviZSampleChainsDynamicHMCExt
            julia-version: pre
        include:
          - extension: ArviZSampleChainsExt
            julia-version: '1.11'
          - extension: ArviZSampleChainsDynamicHMCExt
            julia-version: '1.11'
    steps:
      - uses: actions/checkout@v7
      - uses: julia-actions/setup-julia@v3
        with:
          version: ${{ matrix.julia-version }}
          arch: x64
      - uses: julia-actions/julia-buildpkg@v1
      - run: |
          julia --code-coverage=user -e '
            using Pkg
            test_path = joinpath(pwd(), "test", "ext", "${{ matrix.extension }}")
            Pkg.activate(test_path)
            Pkg.develop(PackageSpec(path=pwd()))
            include(joinpath(test_path, "runtests.jl"))'
      - uses: julia-actions/julia-processcoverage@v1
      - uses: codecov/codecov-action@v7
        with:
          files: lcov.info
