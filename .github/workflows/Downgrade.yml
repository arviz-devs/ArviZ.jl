name: Downgrade
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: Downgrade / Julia ${{ matrix.julia-version }} - ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        julia-version: ["lts"]
        os: [ubuntu-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: julia-actions/setup-julia@v3
        with:
          version: ${{ matrix.julia-version }}
          arch: x64
      - uses: julia-actions/cache@v3
      - uses: julia-actions/julia-downgrade-compat@v2.7.0
        with:
          mode: deps
          projects: ".,test"
          skip: Test
      - uses: julia-actions/julia-buildpkg@v1
        with:
          project: "test"
      - run: |
          import Pkg
          Pkg.develop(Pkg.PackageSpec(path=pwd()))
          Pkg.instantiate()
          Pkg.status(; mode=Pkg.PKGMODE_MANIFEST)
          include(joinpath(pwd(), "test", "runtests.jl"))
        shell: julia --color=yes --project=test/ --check-bounds=yes --depwarn=yes --code-coverage=@ {0}
      - uses: julia-actions/julia-processcoverage@v1
      - uses: codecov/codecov-action@v7
        with:
          fail_ci_if_error: false
